name: claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Read the code, write the review. Nothing here pushes commits — the action is
# given no write tools, so the worst it can do to a branch is talk about it.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Two guards, both of which are "the run would fail anyway":
    #
    # A pull request from a fork gets no access to repository secrets, so the
    # token below would be empty and the action would exit on authentication.
    # Skipping is quieter than a red X on every outside contribution.
    #
    # A draft is by definition not finished, and re-reviewing on every push to
    # one burns tokens on code the author is still moving around. Marking it
    # ready for review fires `ready_for_review` and the review happens then.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The review reads the diff against the base branch, which needs the
          # base branch present. The default shallow checkout does not have it.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Explicit, and not optional. Left out, the action tries to mint a
          # token for the Claude GitHub App over OIDC instead, which needs both
          # `id-token: write` and the app installed on the repository, and
          # fails with "Could not fetch an OIDC token" when it has neither.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # A subscription token, minted with `claude setup-token`. Swap for
          # `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` to bill the
          # API instead; the action takes either, and nothing else changes.
          #
          # Deliberately not the conventional `CLAUDE_CODE_OAUTH_TOKEN`. A pull
          # request runs the workflow file from its own head, so one that
          # restored an older revision of this file would resurrect whatever
          # that revision allowed. Under a name no earlier revision ever
          # referenced, such a run authenticates against nothing and dies before
          # it reaches a tool.
          claude_code_oauth_token: ${{ secrets.CLAUDE_REVIEW_TOKEN }}
          # Posts a checklist comment while it works and edits it when done,
          # so a run that dies halfway is visible rather than silent.
          track_progress: true
          # One comment per pull request, rewritten on each push, instead of a
          # new one every time the author pushes a fixup.
          use_sticky_comment: true
          # No tool here can run repository code. The checkout is the pull
          # request's own branch, so anything it could execute is written by the
          # author under review, and this job holds a subscription token that a
          # test file could read straight out of its environment. The `test`
          # workflow runs the suite instead, with no secrets in reach.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md and ARCHITECTURE.md first —
            this widget has a backend contract, and most of its rules are there
            because breaking them shipped a bug once. Review against that
            contract, not against generic best practice.

            Look for, in roughly this order:

            - Contract violations. `detect(force)` must not fall through to
              `refresh()`. A status that cannot be read must be kept stale
              rather than blanked. A backend that blocks traffic while
              disconnected must expose `lockdownMode` and a `lockdownHint`
              naming the command in its own vocabulary. Connects go through
              `VpnController.connectVia()` / `toggleActive()` and disconnects
              through `disconnectActive()`, never straight to a backend.
            - Parsing that assumes CLI output it has not seen. These parsers
              break when a tool changes its wording. A fix to one should come
              with the real output that broke it pasted into a test.
            - Layering. `model/*.js` are QML `.pragma library` scripts: `var`
              and `function` declarations only, no imports beyond
              `.import "Shared.js" as Shared`, no QML objects, no side effects,
              pure functions of their arguments. No model file may reach into
              another tool's. Decisions belong in `model/`, not in the backend
              that calls it, because `model/` is the half under test.
            - Edits to `Panel.qml` or `model/Shared.js` that a new backend
              needed. That usually means the contract is missing something, and
              is worth saying out loud in the review.
            - Hand-edits to `CHANGELOG.md` or the version in `manifest.json`.
              Release-please owns both and overwrites them.
            - A new backend `label` missing from the `preferredBackend` enum in
              `manifest.json`. Nothing at runtime can fill that in.
            - Pasted Nerd Font glyphs where `String.fromCodePoint` belongs.
              Editing tools mangle multi-byte sequences in QML.

            Leave inline comments with
            mcp__github_inline_comment__create_inline_comment (pass
            confirmed: true) on specific lines, and finish with a short summary.
            Say what is wrong and why it matters. Skip praise, skip formatting
            nits, and skip restating what the diff does — the author can read
            it. If the change looks correct, say so in one line rather than
            manufacturing findings.
